<!DOCTYPE html>
<html>
<head>
	<title> Navigation</title>
	<style>
		ul{
			list-style:none;
			padding;0;
			margin:0;
			background-color:black;
			border:5px white;
			text-align:center;
		}
		
		a{
			text-decoration:none;
			color:white;
			
		}
		
		li{
			display:inline;
			margin-right:40px;
			font-size:20px;
		}
		a:hover{
			color:blue;
		}
	
	
	
	</style>
</head>
<body>
<h1><center> My Website</center></h1>
<nav>
<ul>
	<li><a href="">Home</a></li>
	<li><a href="">About</a></li>
	<li><a href="">Services</a></li>
	<li><a href="">Contact</a></li>
	
</ul>
 </nav>
</body>
</html>
