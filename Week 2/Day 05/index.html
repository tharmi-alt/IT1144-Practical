<!DOCTYPE html>
<html lang="en">
<head>
	<title>Student Registration Form</title>
	<style>
	body{
	     font-family: sans-serif;
	     background-color:#f0f4f8;
	     padding:40px;
	     margin:0
	}
	h1{
	     color:black;
	     font-size:1.6rem;

	}
	button{
	color:white;background-color:blue
	}
	</style>

<body>
  <h1>Student Registration Form</h1>
     <form> 
        <label>Full Name</label><br>

		<label>password</label><br>

		<label>Age</label><br>

		<label>Phone Number</label><br>
		<input type="tel" placeholder="+94770000000"></input><br><br>
		
		<p>Gender</p>
		<label>
		Male<input type="radio" name="Gender"checked></input>
		</label> 
		
		<label>

		</label>
		 
		 <label>
		Prefer not to say<input type="radio" name="Gender"></input>
		</label><br><br>
		
		<p>Skills</p>
		<label>
		<input type="checkbox" name="Skills "></input>
		HTML
		</label>

		</label>
		
		<label>

		</label>

		  <option>--Select Year--</option>

		  <option>3rd YEAR</option>
		  <option>4th YEAR</option>
		</select><br><br>
		
		<label>About you</label>

		<button type="submit" color="red"> Regeister Now</button>
		
		
     </Form>
</body>
</html>
